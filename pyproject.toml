[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-neuro"
version = "0.2.0"
description = "Transcript-grounded sparse-feature analysis and fMRI/LLM structure comparison."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Daniel Arturo Mora Soler"}]
requires-python = ">=3.11"
keywords = ["neuroscience", "fmri", "sparse-autoencoders", "interpretability", "language-models", "encoding-models"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
models = [
  "datasets>=2.20.0,<4",
  "huggingface_hub>=0.24.0",
  "numpy>=1.26.0",
  "safetensors>=0.4.3",
  "sae-lens>=3.20.0",
  "torch>=2.4.0",
  "transformers>=4.44.0",
]
brain = [
  "nibabel>=5.2.0",
  "nilearn>=0.10.4",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
]
judge = ["openai>=1.0.0"]
notebooks = [
  "ipykernel>=6.29.0",
  "jupyterlab>=4.2.0",
  "matplotlib>=3.9.0",
  "nbformat>=5.10.0",
  "pandas>=2.2.0",
  "seaborn>=0.13.0",
]
dev = [
  "nbformat>=5.10.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]
full = [
  "datasets>=2.20.0,<4",
  "huggingface_hub>=0.24.0",
  "ipykernel>=6.29.0",
  "jupyterlab>=4.2.0",
  "matplotlib>=3.9.0",
  "nbformat>=5.10.0",
  "nibabel>=5.2.0",
  "nilearn>=0.10.4",
  "numpy>=1.26.0",
  "openai>=1.0.0",
  "openai-whisper>=20240930",
  "pandas>=2.2.0",
  "Pillow>=10.4.0",
  "requests>=2.32.0",
  "safetensors>=0.4.3",
  "sae-lens>=3.20.0",
  "seaborn>=0.13.0",
  "srt>=3.5.3",
  "torch>=2.4.0",
  "transformers>=4.44.0",
]

[project.urls]
Repository = "https://github.com/daMS2005/thesis_neuro"
Issues = "https://github.com/daMS2005/thesis_neuro/issues"
"Companion paper" = "https://github.com/daMS2005/A-Cross-Description-Test-of-Sparse-Feature-Correspondence-Between-Language-Models-and-fMRI-Responses"

[project.scripts]
thesis-neuro = "thesis_neuro.cli:main"
thesis-neuro-audit = "thesis_neuro.audit_launcher:main"
thesis-neuro-structure = "structure_comparison.cli:main"
thesis-neuro-benchmark = "benchmark_comparison.workflow:main"

[tool.setuptools]
include-package-data = true
packages = [
  "thesis_neuro",
  "thesis_neuro.pipelines",
  "thesis_neuro.probes",
  "thesis_neuro.static",
  "benchmark_comparison",
  "structure_comparison",
]

[tool.setuptools.package-dir]
thesis_neuro = "src/thesis_neuro"
benchmark_comparison = "benchmark_comparison"
structure_comparison = "structure_comparison"

[tool.setuptools.package-data]
thesis_neuro = ["static/*.css", "static/*.html", "static/*.js"]
benchmark_comparison = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires local data, model weights, or network access",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"structure_comparison/_implementation.py" = ["E501"]
