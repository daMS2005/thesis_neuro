name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src benchmark_comparison structure_comparison eda_brain_data/scripts tests scripts
      - name: Compile
        run: python -m compileall -q src benchmark_comparison structure_comparison eda_brain_data/scripts scripts tests
      - name: Test
        run: pytest
      - name: Validate notebooks
        run: python scripts/validate_notebooks.py
      - name: Validate Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check repository hygiene
        run: python scripts/check_repo_hygiene.py
