name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src scripts tests
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: pytest
      - name: Mock extraction smoke run
        run: |
          thesis-neuro --config configs/examples/mock.yaml mock-extract
          thesis-neuro-benchmark validate-items --items-path examples/benchmark/mock_boolq.jsonl
